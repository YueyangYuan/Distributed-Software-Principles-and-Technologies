services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: seckill-nacos
    environment:
      MODE: standalone
    ports:
      - "${NACOS_HOST_PORT:-18848}:8848"
    networks:
      - seckill-net

  mysql-master:
    image: mysql:8.0
    container_name: seckill-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "${MYSQL_MASTER_HOST_PORT:-13306}:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-master-data:/var/lib/mysql
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON
    networks:
      - seckill-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-slave:
    image: mysql:8.0
    container_name: seckill-mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "${MYSQL_SLAVE_HOST_PORT:-13307}:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --server-id=2 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --read-only=1
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - seckill-net

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    networks:
      - seckill-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: seckill-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - seckill-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: seckill-kafka
    ports:
      - "${KAFKA_HOST_PORT:-19092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - seckill-net

  user-service-1:
    build: ./seckill-user
    container_name: user-service-1
    restart: on-failure
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql-master
      REDIS_HOST: redis
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql-master:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - seckill-net

  user-service-2:
    build: ./seckill-user
    container_name: user-service-2
    restart: on-failure
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql-master
      REDIS_HOST: redis
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql-master:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - seckill-net

  product-service:
    build: ./seckill-product
    container_name: product-service
    restart: on-failure
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql-master
      MYSQL_SLAVE_HOST: mysql-slave
      REDIS_HOST: redis
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql-master:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - seckill-net

  inventory-service:
    build: ./seckill-inventory
    container_name: inventory-service
    restart: on-failure
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql-master
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      - kafka
      - mysql-master
      - nacos
    networks:
      - seckill-net

  order-service-1:
    build: ./seckill-order
    container_name: order-service-1
    restart: on-failure
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql-master
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      WORKER_ID: 1
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      - kafka
      - mysql-master
      - nacos
    networks:
      - seckill-net

  order-service-2:
    build: ./seckill-order
    container_name: order-service-2
    restart: on-failure
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql-master
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      WORKER_ID: 2
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      - kafka
      - mysql-master
      - nacos
    networks:
      - seckill-net

  gateway-service:
    build: ./seckill-gateway
    container_name: gateway-service
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      NACOS_SERVER_ADDR: nacos:8848
    ports:
      - "${GATEWAY_HOST_PORT:-18081}:8080"
    depends_on:
      - nacos
      - redis
      - user-service-1
      - user-service-2
      - product-service
      - order-service-1
      - order-service-2
      - inventory-service
    networks:
      - seckill-net

  nginx:
    image: nginx:alpine
    container_name: seckill-nginx
    ports:
      - "${NGINX_HOST_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - user-service-1
      - user-service-2
      - product-service
      - order-service-1
      - order-service-2
      - inventory-service
      - gateway-service
    networks:
      - seckill-net

volumes:
  mysql-master-data:

networks:
  seckill-net:
    driver: bridge
