<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seckill Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header><h1>Flash Sale Demo</h1><div id="user-info"></div></header>

        <div id="auth-section" class="card">
            <h2>User Login</h2>
            <input id="username" placeholder="Username" />
            <input id="password" type="password" placeholder="Password" />
            <div class="btn-group">
                <button onclick="login()">Login</button>
                <button onclick="register()" class="btn-secondary">Register</button>
            </div>
        </div>

        <div id="product-section" class="card" style="display:none">
            <h2>Products</h2>
            <div id="product-list"></div>
        </div>

        <div id="order-section" class="card" style="display:none">
            <h2>My Orders</h2>
            <button onclick="loadOrders()">Refresh Orders</button>
            <div id="order-list"></div>
        </div>

        <div id="msg" class="msg"></div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
